<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskBerry – Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  
  <div class="layout">

    <aside class="left-sidebar">
      <div class="sidebar-header">
        <h2 class="logo">TaskBerry</h2>
      </div>

      <div class="sidebar-section">
        <h3>Weekly Overview</h3>
        <ul id="weeklyList" class="weekly-list"></ul>
      </div>

      <div class="sidebar-section add-task-wrapper highlighted-card">
        <h3>+ New Task</h3>
        <div class="add-task-form">
          <input id="taskTitle" placeholder="Task title" />
          <textarea id="taskDesc" placeholder="Description..."></textarea>
          
          <div class="date-time-row">
            <input id="taskDate" type="date" />
            <input id="taskTime" type="time" />
          </div>

          <button onclick="createNewTask()" class="btn-add">Create Task</button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="welcome-text">
          <h1>My Tasks</h1>
          <p>Manage your daily goals</p>
        </div>

        <div class="date-controller">
          <button onclick="prevWeek()" class="nav-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <span id="weekRange" class="week-range-text"></span>
          <button onclick="nextWeek()" class="nav-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      </header>

      <div class="day-selector-wrapper">
        <div class="day-selector" id="daySelector"></div>
      </div>

      <div id="taskGrid" class="task-grid"></div>
    </main>

    <aside class="right-sidebar">
      
      <div class="profile-section">
        <div class="profile-header">
          <img id="profileAvatar" src="assets/user-icon.svg" class="avatar" />
          <div class="profile-info">
            <h3 id="profileName">User</h3>
            <p id="profileEmail" class="email">Loading...</p>
          </div>
        </div>
        
        <button onclick="logout()" class="btn-logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Log Out
        </button>
      </div>

      <div class="weather-card">
        <div id="weatherLoading">
          <p>Finding location...</p>
        </div>
        
        <div id="weatherContent" class="hidden">
          <div class="weather-top">
            <img id="weatherIcon" src="" alt="icon">
            <span id="weatherTemp">--°</span>
          </div>
          <div class="weather-info">
            <h4 id="weatherCity">City</h4>
            <p id="weatherDesc">Description</p>
          </div>
        </div>
      </div>

    </aside>

  </div>

  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Task</h3>
        <button onclick="closeModal()" class="close-icon">&times;</button>
      </div>
      <label>Title</label>
      <input id="editTitle" type="text">
      <label>Description</label>
      <textarea id="editDesc"></textarea>
      <div class="row">
        <div><label>Date</label><input id="editDate" type="date"></div>
        <div><label>Time</label><input id="editTime" type="time"></div>
      </div>
      <div class="modal-actions">
        <button onclick="saveEdit()" class="btn-save">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="dashboard.js"></script>
  <script src="main.js"></script>
</body>
</html>
