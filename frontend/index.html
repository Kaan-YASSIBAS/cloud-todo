<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskBerry – Welcome</title>
  <link rel="stylesheet" href="login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  
  <div class="login-page">
    
    <div class="login-card">
      
      <div class="login-header">
        <div class="icon-circle">
          <img src="assets/taskberry-logo.svg" alt="TaskBerry Logo" class="user-avatar">
        </div>
        <h2 class="title">Welcome to <span>TaskBerry</span></h2>
        <p id="page-subtitle" class="subtitle">Please login to continue</p>
      </div>

      <div id="login-box" class="form-content">
        <div class="input-group">
          <label> Username</label>
          <input id="username" type="text" placeholder="Enter your username" />
        </div>
        
        <div class="input-group">
          <label>Password</label>
          <input id="password" type="password" placeholder="Enter your password" />
        </div>

        <button onclick="handleLogin()" class="btn-login">LOGIN</button>
        
        <p class="switch-text">
          Don't have an account? 
          <span onclick="toggleForms('register')" class="link-btn">Sign up</span>
        </p>
      </div>

      <div id="register-box" class="form-content hidden">
        <div class="input-group">
          <label>Username</label>
          <input id="reg-username" type="text" placeholder="Choose a username" />
        </div>

        <div class="input-group">
          <label>Email (Optional)</label>
          <input id="reg-email" type="email" placeholder="example@mail.com" />
        </div>
        
        <div class="input-group">
          <label>Password</label>
          <input id="reg-password" type="password" placeholder="Create a password" />
        </div>

        <button onclick="handleRegister()" class="btn-login btn-register">SIGN UP</button>
        
        <p class="switch-text">
          Already have an account? 
          <span onclick="toggleForms('login')" class="link-btn">Login</span>
        </p>
      </div>

      <p id="error" class="error-msg"></p>
      <p id="success" class="success-msg"></p>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
