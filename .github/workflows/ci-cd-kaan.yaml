name: CI/CD (per-service SemVer tags + kaan-branch SHA deploy -> OpenShift)

on:
  # Tag mode: semantic version deploy (per component)
  push:
    tags:
      - "auth-v*"
      - "task-v*"
      - "frontend-v*"

    # Branch mode: push to kaan-branch triggers "latest-like" deploy,
    # but we deploy by SHA to avoid OpenShift/node image cache issues.
    branches:
      - "kaan-branch"

    # Only run when these paths change (saves CI minutes)
    paths:
      - "auth-service/**"
      - "task-service/**"
      - "frontend/**"

  # Manual run (optional): allows deploying any tag you provide
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g., task-v1.0.5 / frontend-v1.0.6). If empty, uses ref_name."
        required: false
        default: ""

env:
  REGISTRY: docker.io
  IMAGE_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_REPO: cloud-todo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Detect mode: tag vs branch
      # ------------------------------------------------------------
      - name: Detect run mode
        id: mode
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "MODE=tag" >> $GITHUB_OUTPUT
          else
            echo "MODE=branch" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------
      # Tag mode: determine TAG name (from input or ref)
      # ------------------------------------------------------------
      - name: Determine tag name
        id: tag
        if: steps.mode.outputs.MODE == 'tag' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------
      # Branch mode: detect which components changed
      # ------------------------------------------------------------
      - name: Detect changed components
        id: changed
        if: steps.mode.outputs.MODE == 'branch'
        shell: bash
        run: |
          CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)"

          AUTH=false
          TASK=false
          FRONTEND=false

          echo "$CHANGED" | grep -q '^auth-service/' && AUTH=true || true
          echo "$CHANGED" | grep -q '^task-service/' && TASK=true || true
          echo "$CHANGED" | grep -q '^frontend/' && FRONTEND=true || true

          echo "AUTH=$AUTH" >> $GITHUB_OUTPUT
          echo "TASK=$TASK" >> $GITHUB_OUTPUT
          echo "FRONTEND=$FRONTEND" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------
      # Tag mode: parse component + version from tag (auth-v1.2.3 etc.)
      # ------------------------------------------------------------
      - name: Parse component + version
        id: meta
        if: steps.mode.outputs.MODE == 'tag' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          COMPONENT="${TAG%%-v*}"
          VERSION="${TAG#*-v}"

          echo "COMPONENT=$COMPONENT" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ============================================================
      # BUILD & PUSH (TAG MODE)  -> immutably versioned tags
      # ============================================================
      - name: Build & push auth (tag)
        if: steps.meta.outputs.COMPONENT == 'auth'
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:auth-service-v${{ steps.meta.outputs.VERSION }}

      - name: Build & push task (tag)
        if: steps.meta.outputs.COMPONENT == 'task'
        uses: docker/build-push-action@v6
        with:
          context: ./task-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:task-service-v${{ steps.meta.outputs.VERSION }}

      - name: Build & push frontend (tag)
        if: steps.meta.outputs.COMPONENT == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:frontend-v${{ steps.meta.outputs.VERSION }}

      # ============================================================
      # BUILD & PUSH (BRANCH MODE) -> push SHA tags (guaranteed unique)
      # Optionally also push "service-latest" tags for convenience.
      # ============================================================
      - name: Build & push auth (branch)
        if: steps.mode.outputs.MODE == 'branch' && steps.changed.outputs.AUTH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:auth-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:auth-service-latest

      - name: Build & push task (branch)
        if: steps.mode.outputs.MODE == 'branch' && steps.changed.outputs.TASK == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./task-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:task-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:task-service-latest

      - name: Build & push frontend (branch)
        if: steps.mode.outputs.MODE == 'branch' && steps.changed.outputs.FRONTEND == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:frontend-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:frontend-latest

      # ------------------------------------------------------------
      # OpenShift CLI setup + login
      # ------------------------------------------------------------
      - name: Install oc
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz -o oc.tar.gz
          tar -xzf oc.tar.gz
          sudo mv oc /usr/local/bin/oc

      - name: Login & select project
        run: |
          oc login "${{ secrets.OPENSHIFT_SERVER }}" --token="${{ secrets.OPENSHIFT_TOKEN_KAAN }}" --insecure-skip-tls-verify=true
          oc project "${{ secrets.OPENSHIFT_NAMESPACE_KAAN }}"

      # ============================================================
      # DEPLOY (TAG MODE) -> deploy exactly the requested version
      # ============================================================
      - name: Deploy auth (tag)
        if: steps.meta.outputs.COMPONENT == 'auth'
        run: |
          oc set image deploy/auth-service auth-service=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:auth-service-v${{ steps.meta.outputs.VERSION }}
          oc rollout status deploy/auth-service --timeout=300s

      - name: Deploy task (tag)
        if: steps.meta.outputs.COMPONENT == 'task'
        run: |
          oc set image deploy/task-service task-service=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:task-service-v${{ steps.meta.outputs.VERSION }}
          oc rollout status deploy/task-service --timeout=300s

      - name: Deploy frontend (tag)
        if: steps.meta.outputs.COMPONENT == 'frontend'
        run: |
          oc set image deploy/frontend frontend=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:frontend-v${{ steps.meta.outputs.VERSION }}
          oc rollout status deploy/frontend --timeout=300s

      # ============================================================
      # DEPLOY (BRANCH MODE) -> deploy by SHA (avoids image cache)
      # IMPORTANT: Do NOT deploy "latest" tags here.
      # ============================================================
      - name: Deploy auth (branch)
        if: steps.mode.outputs.MODE == 'branch' && steps.changed.outputs.AUTH == 'true'
        run: |
          oc set image deploy/auth-service auth-service=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:auth-${{ github.sha }}
          oc rollout status deploy/auth-service --timeout=300s

      - name: Deploy task (branch)
        if: steps.mode.outputs.MODE == 'branch' && steps.changed.outputs.TASK == 'true'
        run: |
          oc set image deploy/task-service task-service=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:task-${{ github.sha }}
          oc rollout status deploy/task-service --timeout=300s

      - name: Deploy frontend (branch)
        if: steps.mode.outputs.MODE == 'branch' && steps.changed.outputs.FRONTEND == 'true'
        run: |
          oc set image deploy/frontend frontend=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_REPO }}:frontend-${{ github.sha }}
          oc rollout status deploy/frontend --timeout=300s
