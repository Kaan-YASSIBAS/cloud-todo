version: "3.9"

services:
  # ======================
  # MySQL Database
  # ======================
  mysql:
    image: mysql:8.0
    container_name: todo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${DB_USER} -p${DB_PASS} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ======================
  # Auth Service
  # ======================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_EXPIRE_HOURS: ${ACCESS_EXPIRE_HOURS}
      JWT_ALG: ${JWT_ALG}

      # Database
      DATABASE_URL: "mysql+mysqlconnector://${DB_USER}:${DB_PASS}@mysql:3306/${DB_NAME}"

      # Service Info
      SERVICE_NAME: auth
      PORT: 8001

    restart: unless-stopped

  # ======================
  # Task Service
  # ======================
  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    container_name: task-service
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "${TASK_HOST_PORT}:${TASK_PORT}"
    environment:
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG}

      # Database connection
      DATABASE_URL: "mysql+mysqlconnector://${DB_USER}:${DB_PASS}@mysql:3306/${DB_NAME}"

      # Service Info
      SERVICE_NAME: ${SERVICE_NAME}
      PORT: ${TASK_PORT}

    restart: unless-stopped

  # ======================
  # Frontend (vanilla JS)
  # ======================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    depends_on:
      - auth-service
      - task-service
    ports:
      - "5500:80"   # http://localhost:5500
    restart: unless-stopped

volumes:
  mysql_data:
