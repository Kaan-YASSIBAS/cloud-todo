version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: todo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${DB_USER} -p${DB_PASS} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      # JWT settings
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_EXPIRE_HOURS: "4"

      # Database connection (MySQL service name = mysql)
      DATABASE_URL: "mysql+mysqlconnector://${DB_USER}:${DB_PASS}@mysql:3306/${DB_NAME}"

    restart: unless-stopped

volumes:
  mysql_data:
