version: "3.9"

services:
  todo_db:
    image: mysql:8.0
    container_name: todo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: todo_db
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: todo_pass
      TZ: Europe/Istanbul
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    restart: unless-stopped
    depends_on:
      todo_db:
        condition: service_healthy
    environment:
      JWT_SECRET: super-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_EXPIRE_HOURS: 4
      DATABASE_URL: mysql+pymysql://todo_user:todo_pass@todo_db:3306/todo_db
      CORS_ORIGINS: http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500,*
    ports:
      - "8001:8001"

  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    container_name: task_service
    restart: unless-stopped
    depends_on:
      todo_db:
        condition: service_healthy
    environment:
      SERVICE_NAME: task-service
      PORT: 8002
      JWT_SECRET: super-secret-key
      JWT_ALGORITHM: HS256
      DATABASE_URL: mysql+pymysql://todo_user:todo_pass@todo_db:3306/todo_db
      CORS_ORIGINS: http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500,*
    ports:
      - "8002:8002"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo_frontend
    restart: unless-stopped
    depends_on:
      - auth-service
      - task-service
    ports:
      - "8080:80"

volumes:
  db_data:
