apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: cloud-todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: kaanyassibas/cloud-todo:auth-service-latest
          ports:
            - containerPort: 8001
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: DB_PASS
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: DB_NAME
            - name: ACCESS_EXPIRE_HOURS
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: ACCESS_EXPIRE_HOURS
            - name: DATABASE_URL
              value: "mysql+mysqlconnector://$(DB_USER):$(DB_PASS)@mysql:3306/$(DB_NAME)"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
