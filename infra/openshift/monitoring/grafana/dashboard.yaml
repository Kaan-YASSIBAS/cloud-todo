apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  cloud-todo-full.json: |
    {
      "uid": "cloudtodo-full",
      "title": "Cloud Todo - Full Monitoring (App + Uptime + Postgres)",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "tags": ["cloud-todo", "prometheus", "blackbox", "postgres"],
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": "Prometheus",
            "refresh": 2,
            "hide": 0,
            "query": {
              "query": "label_values(up{job=\"cloud-todo\"}, instance)",
              "refId": "StandardVariableQuery"
            },
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": ".*" }
          }
        ]
      },
      "panels": [
        {
          "type": "text",
          "title": "Metrics Guide (What you are seeing)",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 6 },
          "options": {
            "mode": "markdown",
            "content": "### Cloud-Todo Monitoring Overview\n\nThis dashboard combines **application metrics**, **HTTP/TCP uptime checks**, and **PostgreSQL metrics**.\n\n**Key metrics explained:**\n- **up**: `1` means the target is reachable by Prometheus; `0` means Prometheus cannot scrape it.\n- **http_requests_total**: total number of HTTP requests handled by a service (counter). We visualize it using `rate()` to get requests per second.\n- **5xx error rate**: server-side failures (bugs, timeouts, DB issues). If no 5xx happened in the selected time range, it will show **0** (healthy).\n- **process_cpu_seconds_total**: CPU time consumed by the process. `rate()` approximates CPU usage over time.\n- **process_resident_memory_bytes (RSS)**: physical memory used by the process.\n- **probe_success** (Blackbox): `1` means the endpoint is reachable; `0` means it is down.\n- **probe_duration_seconds**: latency of the probe (how long the check took).\n- **pg_* metrics**: PostgreSQL internal statistics via postgres-exporter (connections, commits, cache hit ratio, locks, etc.).\n\n> Tip: Use the **service** filter at the top to focus on a single microservice."
          }
        },

        {
          "type": "stat",
          "title": "Auth/Task Health (up)",
          "gridPos": { "x": 0, "y": 6, "w": 8, "h": 5 },
          "targets": [
            { "expr": "min(up{job=\"cloud-todo\", instance=~\"$service\"})", "refId": "A" }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "green", "value": 1 }
              ]}
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "HTTP Uptime (blackbox-http)",
          "gridPos": { "x": 8, "y": 6, "w": 8, "h": 5 },
          "targets": [
            { "expr": "min(probe_success{job=\"blackbox-http\"})", "refId": "A" }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "green", "value": 1 }
              ]}
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Postgres TCP (blackbox-tcp)",
          "gridPos": { "x": 16, "y": 6, "w": 8, "h": 5 },
          "targets": [
            { "expr": "min(probe_success{job=\"blackbox-tcp\"})", "refId": "A" }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "green", "value": 1 }
              ]}
            },
            "overrides": []
          }
        },

        {
          "type": "timeseries",
          "title": "Request rate (req/s) per service",
          "gridPos": { "x": 0, "y": 11, "w": 24, "h": 7 },
          "targets": [
            { "expr": "sum by (instance) (rate(http_requests_total{job=\"cloud-todo\"}[1m]))", "refId": "A" }
          ]
        },

        {
          "type": "timeseries",
          "title": "5xx error rate (req/s) per service (0 = healthy)",
          "gridPos": { "x": 0, "y": 18, "w": 24, "h": 7 },
          "targets": [
            {
              "expr": "sum by (instance) (rate(http_requests_total{job=\"cloud-todo\", status=~\"5..\"}[5m])) OR on() vector(0)",
              "refId": "A"
            }
          ]
        },

        {
          "type": "timeseries",
          "title": "Process CPU rate (auth/task)",
          "gridPos": { "x": 0, "y": 25, "w": 12, "h": 7 },
          "targets": [
            { "expr": "rate(process_cpu_seconds_total{job=\"cloud-todo\", instance=~\"$service\"}[1m])", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Process Memory RSS (MB) (auth/task)",
          "gridPos": { "x": 12, "y": 25, "w": 12, "h": 7 },
          "targets": [
            { "expr": "process_resident_memory_bytes{job=\"cloud-todo\", instance=~\"$service\"} / 1024 / 1024", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "mbytes" },
            "overrides": []
          }
        },

        {
          "type": "timeseries",
          "title": "HTTP Probe duration (s) - routes (blackbox-http)",
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 7 },
          "targets": [
            { "expr": "avg by (instance) (probe_duration_seconds{job=\"blackbox-http\"})", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP status code (blackbox-http)",
          "gridPos": { "x": 12, "y": 32, "w": 12, "h": 7 },
          "targets": [
            { "expr": "probe_http_status_code{job=\"blackbox-http\"}", "refId": "A" }
          ]
        },

        {
          "type": "timeseries",
          "title": "Postgres connections (postgres-exporter)",
          "gridPos": { "x": 0, "y": 39, "w": 12, "h": 7 },
          "targets": [
            { "expr": "pg_stat_activity_count{job=\"postgres-exporter\"}", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Postgres TPS (commits/s)",
          "gridPos": { "x": 12, "y": 39, "w": 12, "h": 7 },
          "targets": [
            { "expr": "sum(rate(pg_stat_database_xact_commit{job=\"postgres-exporter\"}[1m]))", "refId": "A" }
          ]
        },

        {
          "type": "timeseries",
          "title": "Postgres DB size (MB)",
          "gridPos": { "x": 0, "y": 46, "w": 12, "h": 7 },
          "targets": [
            { "expr": "pg_database_size_bytes{job=\"postgres-exporter\"} / 1024 / 1024", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "mbytes" },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Postgres cache hit ratio (%)",
          "gridPos": { "x": 12, "y": 46, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "100 * (sum(pg_stat_database_blks_hit{job=\"postgres-exporter\"}) / (sum(pg_stat_database_blks_hit{job=\"postgres-exporter\"}) + sum(pg_stat_database_blks_read{job=\"postgres-exporter\"})))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percent" },
            "overrides": []
          }
        },

        {
          "type": "timeseries",
          "title": "Postgres locks",
          "gridPos": { "x": 0, "y": 53, "w": 24, "h": 7 },
          "targets": [
            { "expr": "pg_locks_count{job=\"postgres-exporter\"}", "refId": "A" }
          ]
        }
      ],
      "annotations": { "list": [] }
    }
