apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # App metrics
      - job_name: "cloud-todo"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "auth-service:8001"
              - "task-service:8002"

      # Blackbox HTTP (routes)
      - job_name: "blackbox-http"
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - "https://frontend-kyassibas-dev.apps.rm2.thpm.p1.openshiftapps.com"
              - "https://auth-service-kyassibas-dev.apps.rm2.thpm.p1.openshiftapps.com/healthz"
              - "https://task-service-kyassibas-dev.apps.rm2.thpm.p1.openshiftapps.com/healthz"
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

      # Blackbox TCP (postgres port)
      - job_name: "blackbox-tcp"
        metrics_path: /probe
        params:
          module: [tcp_connect]
        static_configs:
          - targets:
              - "todo-db:5432"
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

      # Postgres exporter (real DB metrics)
      - job_name: "postgres-exporter"
        static_configs:
          - targets:
              - "postgres-exporter:9187"
