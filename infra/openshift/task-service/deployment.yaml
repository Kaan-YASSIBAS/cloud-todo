apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: kaanyassibas/cloud-todo:task-service-v1.0.2
          ports:
            - containerPort: 8002
          env:
            - name: SERVICE_NAME
              value: "task-service"
            - name: LOKI_URL
              value: "http://loki:3100/loki/api/v1/push"
            - name: PORT
              value: "8002"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: task-service-secret
                  key: JWT_SECRET
            - name: JWT_ALGORITHM
              valueFrom:
                secretKeyRef:
                  name: task-service-secret
                  key: JWT_ALGORITHM
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: task-service-secret
                  key: DATABASE_URL
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: task-service-config
                  key: CORS_ORIGINS
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
