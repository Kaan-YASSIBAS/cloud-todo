apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: kaanyassibas/cloud-todo:auth-service-v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: SERVICE_NAME
              value: "auth-service"
            - name: PORT
              value: "8001"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: JWT_SECRET
            - name: JWT_ALGORITHM
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: JWT_ALGORITHM
            - name: ACCESS_EXPIRE_HOURS
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: ACCESS_EXPIRE_HOURS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DATABASE_URL
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: CORS_ORIGINS
